<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .el--1 {
        background-color: blueviolet;
      }
      .el--2 {
        background-color: orangered;
      }
      .el--3 {
        background-color: green;
        height: 150px;
      }
      .el--4 {
        background-color: goldenrod;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
      }

      /*flexboxでは高さが指定されていない場合は、必要な分だけ占有するように表示される。
      一方で、コンテナ内の一部(この場合か緑のCSS)に高さが指定されている場合は他のアイテムもそれに応じる。
      但し、後にalighn-items=center justyfigh=center など、アイテムに指示を出した場合は、緑は高さを保つが
      他のアイテムは必要な高さだけを占有して指示を受ける。*/

      .container {
        /* STARTER */
        font-family: sans-serif;
        background-color: #ddd;
        font-size: 34px;
        margin: 40px;

        /* FLEXBOX */
        display: flex;
        align-items: center; /*交差軸（垂直方向）にアイテムを移動させる。デフォルトはalign-items:stretch*/
        justify-content: flex-start; /*主軸（水平方向）にアイテムを移動させる。デフォルトは。jusify-content=flex-start*/
        gap: 10px; /*余白を使わずにアイテム間にスペースを作る */
      }

      /*フレックスコンテナ内でalignアイテムを使用すると全てのフレックスアイテムが同じalignとなる。
      1つのalignを上書きしたい場合、align-selfを使用する。*/

      /*flexプロパティは以下の3つの略称。以下、3つはそれぞれデフォルト値を指す*/
      /* .el {
        flex-grow: 0;   子要素をどれだけ大きくさせるか決めるもの。余白で空いたスペースを埋めるときに使われる。
        flex-shrink: 1; flexbox内に要素が収まらない場合、必要に応じて要素を縮小する。
        flex-basis: auto;
      } */

      .el {
        /*flex-basis: 200px;*/
        /* flex-shrink: 0; /*ボックス内を超えて要素が拡大することを許可する場合、デフォルト値「０」から「１」へ*/
        /* flex-grow: 1; 一般的に隙間を埋めたいときは「１」が使われる。 */
        /*flex 0 0 200px*/
        flex: 1;
      }

      .el--1 {
        align-self: flex-start;
      }

      .el--5 {
        align-self: stretch;
        order: 1;
      }

      .el--6 {
        order: -1;
      }

      /*order モバイル画面向けに大きな画面を小さなレイアウトに適応させる際に有効。
      orderはデフォルトでは「０」のため、先頭にしたければ「０」より小さな値を、最後尾にしたければ「０」より大きな値を入力する。*/
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
      <div class="el el--7">to</div>
      <div class="el el--8">learn</div>
    </div>
  </body>
</html>
